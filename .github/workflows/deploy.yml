name: Deploy Next.js App

on:
  push:
    branches:
      - main  # You can change 'main' to the branch you want to deploy from

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # Adjust the version as per your project requirements

      - name: Install dependencies
        run: |
          npm install

      - name: Build Next.js app
        run: |
          npm run build

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no -i "$PRIVATE_KEY" ubuntu@$HOST << 'EOF'
            cd /var/www/html/devoverflow
            git pull origin main
            npm install --legacy-peer-deps
            npm run build
            pm2 restart nextjs-app
          EOF
